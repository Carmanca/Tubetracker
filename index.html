<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TubeTracker</title>
<meta name="description" content="TubeTracker — binnenkort online.">
<style>
  :root { --bg:#0f1115; --fg:#f2f2f2; --muted:#9aa0a6; --accent:#ff3b3b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:16px; text-align:center;
  }
  .logo { display:inline-flex; align-items:center; gap:12px; font-size:clamp(2rem,7vw,3.5rem); font-weight:800; letter-spacing:-0.02em; }
  .dot { width:.6em; height:.6em; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 rgba(255,59,59,.6); animation:pulse 2s infinite; }
  p { margin-top:16px; color:var(--muted); font-size:1.1rem; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,59,59,.6)} 70%{box-shadow:0 0 0 18px rgba(255,59,59,0)} 100%{box-shadow:0 0 0 0 rgba(255,59,59,0)} }
  @media (prefers-reduced-motion:reduce){ .dot{animation:none} }
</style>
</head>
<body>
  <main>
    <div class="logo"><span class="dot"></span>TubeTracker</div>
    <p>Binnenkort online.</p>
  </main>
</body>
</html>
